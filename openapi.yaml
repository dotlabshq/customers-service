openapi: 3.1.0
info:
  title: customers-service
  version: "1.0"
  description: |
    The customer directory: who an organization bills, invoices and collects
    from. One record per customer, scoped to an organization.

    **Every request names an org.** `X-Org-Id` carries it, and this service asks
    org-service whether the caller is a member before touching anything. The org
    id is also the storage tenant, so two organizations' customers are separated
    by the store rather than by a column somebody must remember to filter on.

    Routes live at the service root; a gateway publishes them at
    `/v1/customers/...` and strips that prefix (ADR-042 §4). `/v1` is also
    mounted here for callers that predate the gateway.

servers:
  - url: https://example.com/v1/customers
    description: Behind a gateway
  - url: http://127.0.0.1:3008/api
    description: Direct, for local development

tags:
  - name: discovery
  - name: customers

security:
  - bearer: []

paths:
  /healthz:
    get:
      tags: [discovery]
      summary: Liveness
      security: []
      responses:
        "200": { description: ok }

  /.well-known/service:
    get:
      tags: [discovery]
      summary: What this service is
      security: []
      responses:
        "200":
          description: The manifest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceManifest" }

  /customers:
    get:
      tags: [customers]
      summary: List customers, or resolve one by external id
      description: |
        `?external_id=` looks up the single customer carrying that id in the
        caller's own system, and answers 404 when there is none. Without it,
        a page of the directory.
      parameters:
        - { name: external_id, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string, enum: [company, person] } }
        - { name: role, in: query, schema: { type: string, enum: [customer, supplier, employee, partner] } }
        - { name: tax_id, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Customers, or a single customer when external_id was given
          content:
            application/json:
              schema:
                type: object
                properties:
                  customers:
                    type: array
                    items: { $ref: "#/components/schemas/Customer" }
                  customer: { $ref: "#/components/schemas/Customer" }
        "400": { description: org_required — no X-Org-Id }
        "403": { description: Not a member of this org, or the permission the route asks for is missing (`permission` names it) }
        "404": { description: No customer with that external id }
    post:
      tags: [customers]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer: { $ref: "#/components/schemas/Customer" }
        "409": { description: external_id already belongs to another customer }
        "400": { description: Malformed body }

  /customers/{ref}:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: string }
        description: The id or the short id.
    get:
      tags: [customers]
      summary: One customer
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer: { $ref: "#/components/schemas/Customer" }
        "404": { description: No such customer in this org }
    patch:
      tags: [customers]
      summary: Change a customer
      description: >-
        At least one field. Absent fields are left alone. A field a person has
        locked is skipped and named in `skippedFields`; the rest is applied.
        `unlock` is applied before the write and `lock` after it. Only a person
        locks or unlocks (a service token is answered 403 `person_only`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/CustomerInput" }
                - type: object
                  properties:
                    lock: { type: array, items: { $ref: "#/components/schemas/LockableField" } }
                    unlock: { type: array, items: { $ref: "#/components/schemas/LockableField" } }
      responses:
        "200":
          description: Changed, or left as it was when every named field is locked
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer: { $ref: "#/components/schemas/Customer" }
                  skippedFields: { type: array, items: { $ref: "#/components/schemas/LockableField" } }
        "404": { description: No such customer in this org }
    delete:
      tags: [customers]
      summary: Archive a customer
      description: |
        The record stops appearing in the directory. The events stay — an
        invoice that referenced this customer must still be explicable.
      responses:
        "204": { description: Archived }
        "404": { description: No such customer in this org }

  /customers/{id}/restore:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: The id. An archived record has no other handle. }
    post:
      tags: [customers]
      summary: Bring an archived customer back
      responses:
        "200":
          description: Restored whole, under the same id and short id
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer: { $ref: "#/components/schemas/Customer" }
        "404": { description: No such record }
        "409": { description: not_archived, or external_id_taken when another record now holds its external id }

  /customers/{ref}/links:
    parameters:
      - { name: ref, in: path, required: true, schema: { type: string } }
    get:
      tags: [customers]
      summary: Who is at this company, or where this person is
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  links: { type: array, items: { $ref: "#/components/schemas/Link" } }
    post:
      tags: [customers]
      summary: Link a person and a company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string, description: The other record, by id, short id or external id. }
                title: { type: string, maxLength: 120 }
      responses:
        "201":
          description: Linked
          content:
            application/json:
              schema:
                type: object
                properties:
                  link: { $ref: "#/components/schemas/Link" }
        "404": { description: not_found, or link_target_not_found }
        "409": { description: link_exists }
        "422": { description: link_needs_person_and_company }

  /customers/{ref}/links/{linkId}:
    parameters:
      - { name: ref, in: path, required: true, schema: { type: string }, description: Either side of the link. }
      - { name: linkId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [customers]
      summary: Change a link's title
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 120 }
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  link: { $ref: "#/components/schemas/Link" }
        "404": { description: link_not_found }
    delete:
      tags: [customers]
      summary: Remove a link
      responses:
        "204": { description: Removed }
        "404": { description: link_not_found }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Address:
      type: object
      properties:
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        state: { type: string }
        postalCode: { type: string }
        country: { type: string }

    CustomerInput:
      type: object
      properties:
        name: { type: string }
        kind: { type: string, enum: [company, person], default: company }
        roles:
          type: array
          minItems: 1
          items: { type: string, enum: [customer, supplier, employee, partner] }
          description: Replaced whole. Default [customer].
        website: { type: string }
        externalId:
          type: string
          description: The id in the user's own third-party system. One per record, unique per org.
        email: { type: string, format: email }
        phone: { type: string }
        taxId: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        address: { $ref: "#/components/schemas/Address" }
        metadata: { type: object, additionalProperties: true }

    Customer:
      type: object
      required: [id, shortId, name]
      properties:
        id: { type: string }
        shortId: { type: string }
        externalId: { type: [string, "null"] }
        kind: { type: string, enum: [company, person] }
        roles: { type: array, items: { type: string, enum: [customer, supplier, employee, partner] } }
        name: { type: string }
        website: { type: [string, "null"] }
        lockedFields: { type: array, items: { $ref: "#/components/schemas/LockableField" } }
        email: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        taxId: { type: [string, "null"] }
        currency: { type: [string, "null"] }
        address:
          oneOf:
            - { $ref: "#/components/schemas/Address" }
            - { type: "null" }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: integer }
        updatedAt: { type: integer }

    LockableField:
      type: string
      enum: [name, email, phone, website, taxId, currency, address]

    LinkParty:
      type: object
      properties:
        id: { type: string }
        shortId: { type: string }
        name: { type: string }

    Link:
      type: object
      properties:
        id: { type: string }
        person: { $ref: "#/components/schemas/LinkParty" }
        company: { $ref: "#/components/schemas/LinkParty" }
        title: { type: [string, "null"] }
        createdAt: { type: integer }

    ServiceManifest:
      type: object
      required: [name, version, api_version]
      properties:
        name: { type: string }
        version: { type: string }
        api_version: { type: string }
        openapi_url: { type: string }
        capabilities:
          type: array
          items: { type: string }
